name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SwiftDrop.sln

      - name: Build
        run: dotnet build SwiftDrop.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SwiftDrop.sln --no-build --configuration Release --logger trx --results-directory artifacts/test-results

      - name: Verify process startup and project boundaries
        shell: pwsh
        run: ./scripts/verify-foundation.ps1

  docker-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            project: src/Gateway/SwiftDrop.Gateway/SwiftDrop.Gateway.csproj
          - service: identity
            project: src/Services/Identity/SwiftDrop.Identity.Api/SwiftDrop.Identity.Api.csproj
          - service: delivery
            project: src/Services/Delivery/SwiftDrop.Delivery.Api/SwiftDrop.Delivery.Api.csproj
          - service: merchant
            project: src/Services/Merchant/SwiftDrop.Merchant.Api/SwiftDrop.Merchant.Api.csproj
          - service: notification-worker
            project: src/Workers/SwiftDrop.Notification.Worker/SwiftDrop.Notification.Worker.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile builds (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: PROJECT_FILE=${{ matrix.project }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
