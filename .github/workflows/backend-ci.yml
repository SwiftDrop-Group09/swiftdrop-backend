name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SwiftDrop.sln

      - name: Build
        run: dotnet build SwiftDrop.sln --no-restore --configuration Release

      - name: Test
        id: tests
        run: dotnet test SwiftDrop.sln --no-build --configuration Release --settings coverage.runsettings --collect "XPlat Code Coverage" --logger "trx;LogFilePrefix=backend" --results-directory artifacts/test-results

      - name: Verify process startup and project boundaries
        shell: pwsh
        run: ./scripts/verify-foundation.ps1

      - name: Consolidate coverage
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            '-reports:artifacts/test-results/*/coverage.opencover.xml' \
            '-targetdir:artifacts/coverage' \
            '-reporttypes:Cobertura;Html;TextSummary;MarkdownSummaryGithub'
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          coverage = ET.parse("artifacts/coverage/Cobertura.xml").getroot()
          covered = int(coverage.attrib["lines-covered"])
          coverable = int(coverage.attrib["lines-valid"])
          percentage = 100 * covered / coverable
          comparison = "meets" if percentage >= 80 else "is below"
          print(f"\nCombined coverage of {covered:,}/{coverable:,} lines ({percentage:.2f}%) "
                f"{comparison} the 80% reporting target. See docs/backend-coverage.md for scope.")
          PY

      - name: Upload backend test results and coverage
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-${{ github.sha }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/*/coverage.cobertura.xml
            artifacts/coverage/
          if-no-files-found: error

  docker-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            project: src/Gateway/SwiftDrop.Gateway/SwiftDrop.Gateway.csproj
          - service: identity
            project: src/Services/Identity/SwiftDrop.Identity.Api/SwiftDrop.Identity.Api.csproj
          - service: delivery
            project: src/Services/Delivery/SwiftDrop.Delivery.Api/SwiftDrop.Delivery.Api.csproj
          - service: merchant
            project: src/Services/Merchant/SwiftDrop.Merchant.Api/SwiftDrop.Merchant.Api.csproj
          - service: notification-worker
            project: src/Workers/SwiftDrop.Notification.Worker/SwiftDrop.Notification.Worker.csproj
          - service: delivery-outbox-relay
            project: src/Workers/SwiftDrop.Delivery.OutboxRelay/SwiftDrop.Delivery.OutboxRelay.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile builds (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: ${{ matrix.service == 'delivery-outbox-relay' }}
          tags: swiftdrop-ci/${{ matrix.service }}:test
          build-args: PROJECT_FILE=${{ matrix.project }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify relay startup, publish confirmation and broker recovery
        if: matrix.service == 'delivery-outbox-relay'
        run: bash scripts/verify-delivery-outbox-relay.sh swiftdrop-ci/delivery-outbox-relay:test
